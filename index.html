<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <div id="bg-layer"></div>
    <div id="vignette"></div>

    <main class="glass-container animate__animated animate__fadeIn">
        
        <div id="quote-container" class="glass-pill">
            <span id="quote-text">"Loading aesthetics..."</span>
        </div>

        <div class="clock-widget">
            <h1 id="time">00:00<span id="seconds" class="small-seconds">00</span></h1>
            <p id="date">Loading Date...</p>
        </div>

        <div class="search-bar glass-input">
            <i class="bi bi-search"></i>
            <input type="text" id="search-input" autocomplete="off">
        </div>

        <div class="quick-links-wrapper">
            <div id="links-grid" class="links-grid"></div>
            <button id="add-link-btn" class="glass-btn-circle" title="Add Link">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </main>

    <button id="settings-btn" class="fab glass-btn animate__animated animate__bounceInUp">
        <i class="bi bi-gear-wide-connected"></i>
    </button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content glass-panel animate__animated animate__zoomIn">
            <div class="modal-header">
                <h2><i class="bi bi-palette2"></i> Themes</h2>
                <button id="close-modal" class="icon-btn"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="modal-body">
                <div class="theme-grid">
                    <button class="theme-card active" data-theme="anime">
                        <div class="preview anime"></div>
                        <span>Anime</span>
                    </button>
                    <button class="theme-card" data-theme="cyber">
                        <div class="preview cyber"></div>
                        <span>Cyber</span>
                    </button>
                    <button class="theme-card" data-theme="lofi">
                        <div class="preview lofi"></div>
                        <span>Lo-Fi</span>
                    </button>
                    <button class="theme-card" data-theme="minimalist">
                        <div class="preview min"></div>
                        <span>Clean</span>
                    </button>
                    <button class="theme-card" data-theme="dark_matter">
                        <div class="preview dark"></div>
                        <span>Dark</span>
                    </button>
                </div>

                <hr class="glass-divider">

                <div class="toggles-row">
                    <button id="mode-toggle" class="glass-toggle">
                        <i id="mode-icon" class="bi bi-moon-stars-fill"></i>
                        <span id="mode-text">Dark Mode</span>
                    </button>
                </div>

                <div class="input-group">
                    <input type="text" id="custom-url" class="glass-input-small" placeholder="Paste Wallpaper URL...">
                    <button id="reset-btn" class="danger-btn" title="Factory Reset"><i class="bi bi-arrow-counterclockwise"></i></button>
                </div>

                <hr class="glass-divider">

                <div class="credits-section">
                    <p>Made by <strong>Ibrahim Khan</strong></p>
                    <div class="social-links">
                        <a href="https://instagram.com/your_handle" target="_blank" class="social-btn instagram"><i class="bi bi-instagram"></i></a>
                        <a href="https://discord.gg/your_server" target="_blank" class="social-btn discord"><i class="bi bi-discord"></i></a>
                        <a href="https://yourportfolio.com" target="_blank" class="social-btn portfolio"><i class="bi bi-briefcase-fill"></i></a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
